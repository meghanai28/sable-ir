[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sable-ir"
version = "0.1.0"
description = "Reproducible experiments for safety-policy retention across planner/renderer handoffs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "tiktoken>=0.11,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]
# Stage 2 local QLoRA stack for the Windows RTX 5080 (Blackwell, sm_120) PC. Torch comes from the
# CUDA 12.8 index on Windows/Linux; macOS resolves a CPU wheel only so the lockfile stays universal.
stage2 = [
  "torch>=2.9,<2.10",
  "transformers>=5.4,<6",
  "peft>=0.18,<1",
  "accelerate>=1.10,<2",
  "bitsandbytes>=0.48,<1",
  # Triton Gated DeltaNet kernels for Qwen3.5. transformers resolves these by importing `fla`
  # (priority: hub kernels, then this package, then a pure-torch fallback), so installing it here
  # is what selects the fast path -- nothing is downloaded at runtime. Triton needs a host C
  # compiler (build-essential) to JIT its CUDA utils; without one, generation raises rather than
  # falling back. Triton-only, hence the Linux marker: Windows keeps the pure-torch path unchanged.
  "flash-linear-attention>=0.5,<1 ; sys_platform == 'linux'",
]
# Stage 3 activation analysis (probes, difference-in-means directions). CPU only; installs on the
# Mac as well so the analysis and its tests run without a GPU.
stage3 = [
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
sable-ir = "sable_ir.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sable_ir"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sable_ir"]

# The Stage 2 ML stack is an optional extra that is only installed on the GPU PC. Treat it as
# untyped everywhere so type checking gives identical results with or without the extra.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "peft", "peft.*"]
ignore_missing_imports = true
follow_imports = "skip"

# scikit-learn ships no type information; numpy does and is checked normally.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
follow_imports = "skip"
