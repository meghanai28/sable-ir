# Stage 4: renderer-ingestion policy-orientation interchange on the Windows RTX 5080 PC.
# This pilot has one held-out task, so every result is a held-out-task case study only.
schema_version = 1
artifacts_dir = "artifacts/stage4"
stage2_config_path = "config/stage2.toml"
stage3_dataset_path = "artifacts/stage3/activations/act-01/dataset.json"
stage3_selection_path = "artifacts/stage3/analysis/fit-01/selection.json"
stage3_heldout_path = "artifacts/stage3/analysis/fit-01/heldout.json"
stage3_report_path = "artifacts/stage3/analysis/fit-01/report.json"
recipient_audit_path = "artifacts/stage4/recipient-audit.json"
divergence_spec_path = "data/stage4/divergence-spec.json"
dev_task_id = "ssrf_redirect"
heldout_task_id = "path_symlink_archive"
# Frozen before capture; it is inside Stage 3's candidate intervention region.
early_layer = 14

[thresholds]
# Development-only distribution checks select the smallest preregistered strength that clears
# both floors and exceeds random-orthogonal and lexical-framing controls.
sanity_min_ab_js_divergence = 0.001
sanity_min_teacher_forced_log_odds_gap = 0.05
# With 16 paired seeds, a percentage tolerance smaller than one sample is not meaningful.
# Each target condition may lose at most one functional output relative to the paired unpatched
# condition (6.25 percentage points at n=16).
target_functionality_max_lost_outputs = 1
# Proposal X.B permits 16-32 draws for one exact plan. Sixteen minimizes the pilot compute bill.
full_samples_per_condition = 16
