schema_version = 1
artifacts_dir = "artifacts"
task_paths = [
  "tasks/path_symlink_report/task.json",
  "tasks/path_symlink_archive/task.json",
  "tasks/sql_identifier/task.json",
  "tasks/command_executable/task.json",
  "tasks/ssrf_redirect/task.json",
]
stage0_manifest_path = "artifacts/stage0/stage0-smoke-20260902-timeout-recovery/manifest.json"
stage0_report_path = "artifacts/stage0/stage0-smoke-20260902-timeout-recovery/reports/final/stage0-report.json"
stage0_g7_audit_path = "artifacts/stage0/audits/stage0-g7-audit-revised.json"
plans_per_cell = 3
renders_per_plan = 4
formats = ["structured", "freeform"]
concision_levels = ["full", "concise", "minimal"]

[hosted_kimi]
provider = "moonshot_ai"
transport = "openai_chat_completions_sse"
model = "kimi-k2.6"
base_url = "https://api.moonshot.ai/v1"
generation_path = "/chat/completions"
api_key_env = "MOONSHOT_API_KEY"
request_timeout_seconds = 120.0
max_stream_seconds = 900.0
minimum_request_interval_seconds = 25.0
max_response_bytes = 8388608
max_sse_events = 100000
max_completion_tokens = 4096
thinking_max_completion_tokens = 32768
max_attempts = 1
automatic_retries = false

[sandbox]
backend = "docker"
image = "python@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7"
platform = "linux/arm64"
compile_timeout_seconds = 5.0
suite_timeout_seconds = 10.0
memory = "256m"
cpus = 1.0
pids_limit = 64
max_output_bytes = 65536
max_candidate_bytes = 262144
